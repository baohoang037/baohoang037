<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 210" width="100%" height="210" fill="none">
  <defs>
    <!-- Background Pure Snow Gradient -->
    <linearGradient id="footerSnowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fcfdfd"/>
    </linearGradient>

    <!-- Glowing Electric Pulse Gradient -->
    <linearGradient id="footerElectricPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Pin Metal Plating Gradient -->
    <linearGradient id="footerPinMetalH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Subtle Circuit Matrix Pattern -->
    <pattern id="footerFaintGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
      <circle cx="22" cy="22" r="0.6" fill="#e2e8f0"/>
    </pattern>

    <!-- Elevation Shadows -->
    <filter id="footerCardShadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>

    <filter id="btnShadow" x="-5%" y="-8%" width="110%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
  </defs>

  <style><![CDATA[
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Continuous Glowing Electric Trace Animation */
    @keyframes footerElectricLoop {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }
    .footer-electric-trace {
      stroke-dasharray: 120 880;
      animation: footerElectricLoop 4.2s linear infinite;
    }
    .footer-electric-secondary {
      stroke-dasharray: 80 920;
      stroke-dashoffset: -500;
      animation: footerElectricLoop 4.2s linear infinite;
    }

    /* Pulsing Green Status Dot */
    @keyframes dotPulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.35); }
    }
    .dot-ping {
      animation: dotPulse 2s ease-in-out infinite;
      transform-origin: 678px 25px;
    }

    /* Interactive Hover Styling */
    .contact-card {
      cursor: pointer;
      text-decoration: none;
    }
    .contact-box {
      transition: all 0.25s ease;
    }
    .contact-card:hover .contact-box {
      stroke: #2563eb;
      filter: drop-shadow(0 4px 10px rgba(37, 99, 235, 0.18));
    }
    .contact-card:hover .arrow-link {
      transform: translate(2px, -2px);
      fill: #2563eb;
    }
    .arrow-link {
      transition: transform 0.2s ease, fill 0.2s ease;
    }
  ]]></style>

  <!-- ==================== IC PINS / CHAN CHIP ==================== -->
  <g id="footer-pins-left">
    <rect x="14" y="32" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="14" y="66" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="14" y="100" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="14" y="134" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="14" y="168" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
  </g>

  <g id="footer-pins-right">
    <rect x="820" y="32" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="820" y="66" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="820" y="100" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="820" y="134" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="820" y="168" width="16" height="7" rx="1.5" fill="url(#footerPinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
  </g>

  <!-- ==================== MAIN CHIP CARRIER ==================== -->
  <rect x="28" y="8" width="794" height="194" rx="12" fill="url(#footerSnowBg)" stroke="#e2e8f0" stroke-width="1.8" filter="url(#footerCardShadow)"/>

  <!-- Faint Circuit Grid -->
  <rect x="29" y="9" width="792" height="192" rx="11" fill="url(#footerFaintGrid)"/>

  <!-- Solder Landing Pads -->
  <g fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.6">
    <rect x="28" y="32" width="5.5" height="7" rx="1"/>
    <rect x="28" y="66" width="5.5" height="7" rx="1"/>
    <rect x="28" y="100" width="5.5" height="7" rx="1"/>
    <rect x="28" y="134" width="5.5" height="7" rx="1"/>
    <rect x="28" y="168" width="5.5" height="7" rx="1"/>

    <rect x="816" y="32" width="5.5" height="7" rx="1"/>
    <rect x="816" y="66" width="5.5" height="7" rx="1"/>
    <rect x="816" y="100" width="5.5" height="7" rx="1"/>
    <rect x="816" y="134" width="5.5" height="7" rx="1"/>
    <rect x="816" y="168" width="5.5" height="7" rx="1"/>
  </g>

  <!-- Static Guard Trace -->
  <rect x="36" y="15" width="778" height="180" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- ==================== CONTINUOUS RUNNING ELECTRIC PULSE TRACE ==================== -->
  <rect x="36" y="15" width="778" height="180" rx="8" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-opacity="0.25" pathLength="1000" class="footer-electric-trace">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="36" y="15" width="778" height="180" rx="8" fill="none" stroke="url(#footerElectricPulse)" stroke-width="2.2" stroke-linecap="round" pathLength="1000" class="footer-electric-trace">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="36" y="15" width="778" height="180" rx="8" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" pathLength="1000" class="footer-electric-secondary">
    <animate attributeName="stroke-dashoffset" from="-500" to="-1500" dur="4.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner Tech Brackets -->
  <g stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 44 18 L 34 18 L 34 28"/>
    <path d="M 806 18 L 816 18 L 816 28"/>
    <path d="M 34 184 L 34 194 L 44 194"/>
    <path d="M 816 184 L 816 194 L 806 194"/>
  </g>

  <!-- ==================== CLEAN ENGLISH CONTACT HEADER BAR ==================== -->
  <g id="footer-top-bar" transform="translate(48, 20)">
    <!-- Contact Title Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="22" height="18" rx="4" fill="#2563eb"/>
      <path d="M 4 4 L 11 9 L 18 4" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- Main Title: Pure English, Clean & Professional -->
    <text x="30" y="14" class="font-sans" font-size="14" font-weight="850" fill="#0f172a" letter-spacing="0.5">
      GET IN TOUCH <tspan fill="#2563eb">//</tspan> CONTACT DIRECTORY
    </text>

    <!-- Status Pill: OPEN TO WORK -->
    <g transform="translate(632, -2)">
      <rect x="0" y="0" width="122" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.1"/>
      <circle cx="12" cy="11" r="5" fill="#10b981" class="dot-ping" opacity="0.3"/>
      <circle cx="12" cy="11" r="3" fill="#059669"/>
      <text x="24" y="14.5" class="font-mono" font-size="8.5" font-weight="700" fill="#059669" letter-spacing="0.5">OPEN TO WORK</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="48" y1="44" x2="802" y2="44" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="48" y1="44" x2="160" y2="44" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>

