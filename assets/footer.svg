      <!-- Left Cyan Brand Accent Bar -->
      <rect x="0" y="0" width="6" height="62" rx="2" fill="#0284c7"/>

      <!-- Globe / Web Vector Icon (Cyan #0284c7) -->
      <g transform="translate(18, 17)">
        <circle cx="14" cy="14" r="13" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
        <line x1="1" y1="14" x2="27" y2="14" stroke="#0284c7" stroke-width="1.4"/>
        <ellipse cx="14" cy="14" rx="6.5" ry="13" fill="none" stroke="#0284c7" stroke-width="1.4"/>
