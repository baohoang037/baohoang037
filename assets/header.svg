<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Pure Snow Gradient -->
    <linearGradient id="snowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fcfdfd"/>
    </linearGradient>

    <!-- Glowing Electric Pulse Gradient -->
    <linearGradient id="electricPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Pin Metal Plating Gradient -->
    <linearGradient id="pinMetalH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Subtle Circuit Dot and Grid Pattern -->
    <pattern id="faintGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
      <circle cx="22" cy="22" r="0.6" fill="#e2e8f0"/>
      <circle cx="11" cy="11" r="0.4" fill="#f1f5f9"/>
    </pattern>

    <!-- Card Subtle Elevation Shadow -->
    <filter id="softCardShadow" x="-3%" y="-6%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.05"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>

    <!-- Clip Path for Typewriter Text Reveal -->
    <!-- Base width is 455px (full name including BAO is always 100% visible) -->
    <!-- Timing: ~3s typing, ~10s holding full text, ~1s reset (Total 14s cycle) -->
    <clipPath id="typewriterClip">
      <rect x="200" y="66" width="455" height="58" class="typing-rect">
        <animate attributeName="width" values="0; 0; 455; 455; 0; 0" keyTimes="0; 0.02; 0.23; 0.94; 0.98; 1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style><![CDATA[
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Continuous Glowing Electric Trace Animation */
    @keyframes electricLoop {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }
    .electric-trace {
      stroke-dasharray: 120 880;
      animation: electricLoop 4.2s linear infinite;
    }
    .electric-trace-secondary {
      stroke-dasharray: 80 920;
      stroke-dashoffset: -500;
      animation: electricLoop 4.2s linear infinite;
    }

    /* Radar Ping Animation */
    @keyframes radarPulse {
      0% { r: 3px; opacity: 0.9; }
      100% { r: 11px; opacity: 0; }
    }
    .radar-ring {
      animation: radarPulse 2s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
      transform-origin: 340px 32px;
    }

    /* Snappy Typewriter Animation: ~3s typing, ~10s display hold, ~1s reset (Total 14s) */
    @keyframes typeReveal {
      0%, 2% { width: 0px; }
      23%, 94% { width: 455px; }
      98%, 100% { width: 0px; }
    }
    .typing-rect {
      animation: typeReveal 14s steps(18, end) infinite;
    }

    /* Blinking Cursor Movement and Blink Animation */
    @keyframes cursorTranslate {
      0%, 2% { transform: translateX(204px); }
      23%, 94% { transform: translateX(652px); }
      98%, 100% { transform: translateX(204px); }
    }
    @keyframes cursorBlink {
      0%, 48% { opacity: 1; }
      50%, 98% { opacity: 0; }
      100% { opacity: 1; }
    }
    .cursor-line {
      animation: cursorTranslate 14s steps(18, end) infinite, cursorBlink 0.8s step-end infinite;
    }
  ]]></style>

  <!-- ==================== IC PINS / CHAN CHIP NGOAI VI ==================== -->
  <g id="header-pins-left">
    <rect x="14" y="38" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="14" y="68" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="14" y="98" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="14" y="128" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="14" y="158" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
  </g>

  <g id="header-pins-right">
    <rect x="820" y="38" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="820" y="68" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="820" y="98" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="820" y="128" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="820" y="158" width="16" height="7" rx="1.5" fill="url(#pinMetalH)" stroke="#94a3b8" stroke-width="0.75"/>
  </g>

  <!-- ==================== MAIN SILICON DIE BODY ==================== -->
  <!-- Chip Substrate: Pure Snow White -->
  <rect x="28" y="10" width="794" height="200" rx="12" fill="url(#snowBg)" stroke="#e2e8f0" stroke-width="1.8" filter="url(#softCardShadow)"/>

  <!-- Faint Circuit Matrix Grid -->
  <rect x="29" y="11" width="792" height="198" rx="11" fill="url(#faintGrid)"/>

  <!-- Solder Landing Pads -->
  <g fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.6">
    <rect x="28" y="38" width="5.5" height="7" rx="1"/>
    <rect x="28" y="68" width="5.5" height="7" rx="1"/>
    <rect x="28" y="98" width="5.5" height="7" rx="1"/>
    <rect x="28" y="128" width="5.5" height="7" rx="1"/>
    <rect x="28" y="158" width="5.5" height="7" rx="1"/>

    <rect x="816" y="38" width="5.5" height="7" rx="1"/>
    <rect x="816" y="68" width="5.5" height="7" rx="1"/>
    <rect x="816" y="98" width="5.5" height="7" rx="1"/>
    <rect x="816" y="128" width="5.5" height="7" rx="1"/>
    <rect x="816" y="158" width="5.5" height="7" rx="1"/>
  </g>

  <!-- Static Guard Trace -->
  <rect x="36" y="18" width="778" height="184" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- ==================== CONTINUOUS RUNNING ELECTRIC PULSE TRACE ==================== -->
  <!-- Glow Layer -->
  <rect x="36" y="18" width="778" height="184" rx="8" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-opacity="0.25" pathLength="1000" class="electric-trace">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Core Electric Spark -->
  <rect x="36" y="18" width="778" height="184" rx="8" fill="none" stroke="url(#electricPulse)" stroke-width="2.2" stroke-linecap="round" pathLength="1000" class="electric-trace">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <!-- Secondary Spark on Opposite Side -->
  <rect x="36" y="18" width="778" height="184" rx="8" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" pathLength="1000" class="electric-trace-secondary">
    <animate attributeName="stroke-dashoffset" from="-500" to="-1500" dur="4.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner Tech Brackets (Electric Blue) -->
  <g stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 44 21 L 34 21 L 34 31"/>
    <path d="M 806 21 L 816 21 L 816 31"/>
    <path d="M 34 189 L 34 199 L 44 199"/>
    <path d="M 816 189 L 816 199 L 806 199"/>
  </g>

  <!-- ==================== TOP STATUS BAR: CORE STATUS: ACTIVE (WITH GREEN RADAR) ==================== -->
  <g id="top-status-bar" transform="translate(325, 20)">
    <!-- Pill Container -->
    <rect x="0" y="0" width="200" height="24" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>

    <!-- Radar Center and Blinking Waves -->
    <g transform="translate(18, 12)">
      <!-- Radar Core Solid Dot -->
      <circle cx="0" cy="0" r="3.2" fill="#059669"/>
      <!-- Radar Outer Expanding Ping -->
      <circle cx="0" cy="0" r="6" fill="none" stroke="#10b981" stroke-width="1.2" class="radar-ring">
        <animate attributeName="r" values="3; 11" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9; 0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <!-- Radar Base Ring -->
      <circle cx="0" cy="0" r="8" fill="none" stroke="#86efac" stroke-width="0.75" stroke-opacity="0.6"/>
    </g>

    <!-- Radar Status Text -->
    <text x="36" y="15.5" class="font-mono" font-size="10.5" font-weight="700" fill="#059669" letter-spacing="1">
      CORE STATUS: ACTIVE
    </text>
  </g>

  <!-- ==================== TAM DIEM: HOANG NGOC GIA BAO (TYPEWRITER EFFECT) ==================== -->
  <!-- textLength="440" guarantees exact length and prevents any truncation on all devices and OS -->
  <g id="center-name-section">
    <!-- Typewriter Animated Text (Clipped) -->
    <g clip-path="url(#typewriterClip)">
      <text x="205" y="106" class="font-sans" font-size="34" font-weight="850" fill="#0f172a" textLength="440" lengthAdjust="spacing">
        HOANG NGOC GIA BAO
      </text>
    </g>

    <!-- Typewriter Blinking Cursor "|" (Synchronized with 14s cycle: ~3s typing, ~10s hold) -->
    <line x1="0" y1="78" x2="0" y2="110" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" class="cursor-line">
      <animateTransform attributeName="transform" type="translate" values="204,0; 204,0; 652,0; 652,0; 204,0; 204,0" keyTimes="0; 0.02; 0.23; 0.94; 0.98; 1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1; 1; 0; 0; 1" keyTimes="0; 0.48; 0.5; 0.98; 1" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ==================== DONG DINH VI: UNDERGRADUATE IC DESIGN STUDENT ==================== -->
  <g id="positioning-subtitle" transform="translate(425, 150)">
    <text x="0" y="0" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="650" fill="#2563eb" letter-spacing="0.5">
      Undergraduate IC Design Student <tspan fill="#94a3b8" font-weight="400">|</tspan> Digital Design &amp; Verification Foundations
    </text>
  </g>

  <!-- Subtle Bottom Circuit Accent Line -->
  <g id="bottom-accent" transform="translate(425, 178)">
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#f1f5f9" stroke-width="1.2"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/>
    <circle cx="-50" cy="0" r="2" fill="#2563eb" fill-opacity="0.7"/>
    <circle cx="50" cy="0" r="2" fill="#2563eb" fill-opacity="0.7"/>
  </g>
</svg>